name: Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      # The suite must never silently shrink to zero collected tests and
      # still report success, so assert a floor on the collected count.
      - name: Assert tests are actually collected
        run: |
          count=$(python -m pytest tests/ --collect-only -q 2>/dev/null | tail -1 | grep -oE '^[0-9]+' || echo 0)
          echo "collected: $count"
          if [ "$count" -lt 100 ]; then
            echo "::error::expected at least 100 collected tests, got $count"
            exit 1
          fi

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Lint
        run: ruff check .
