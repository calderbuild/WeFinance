name: wefinance
channels:
  # conda-forge only: the `defaults` channel carries Anaconda's commercial
  # Terms of Service and every package here is available on conda-forge.
  - conda-forge
  - nodefaults
dependencies:
  # ============================================================
  # Interpreter only. Everything the app imports at runtime is
  # declared in requirements.txt and installed via pip below, so
  # there is exactly one source of truth for runtime versions.
  # Streamlit Cloud installs both files; duplicating pins here
  # meant conda's exact pins silently overrode requirements.txt
  # and production ran a different dependency set than CI.
  # ============================================================
  - python=3.10
  - pip

  # ============================================================
  # Dev-only tooling (not needed to run the app, so deliberately
  # kept out of requirements.txt).
  # ============================================================
  - pytest=7.4.*
  - pytest-cov=4.1.*
  - black>=23.0.0
  - ruff>=0.1.0

  - pip:
    - -r requirements.txt
